name: Deploy to Databricks

# Runs only when you start it from the Actions tab.
# Add DATABRICKS_HOST and DATABRICKS_TOKEN as repository secrets first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/uc_browser/frontend/package-lock.json

      - name: Build React frontend
        working-directory: apps/uc_browser/frontend
        run: |
          npm ci
          npm run build
        # Outputs to apps/uc_browser/static/ via vite.config.ts outDir setting

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t dev

      - name: Start app
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run -t dev uc_browser
